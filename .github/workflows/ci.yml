name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Raw device write on a RAM disk
        if: runner.os == 'macOS'
        run: go test -tags integration -count=1 -v ./internal/burn/
      - run: go build -o bin/ .
      - name: List devices
        run: go run . --list

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
